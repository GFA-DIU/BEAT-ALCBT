name: Feature request
description: Suggest something BEAT should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: who
    attributes:
      label: Who would use it?
      placeholder: e.g. architects in Thailand, a national agency, researchers
